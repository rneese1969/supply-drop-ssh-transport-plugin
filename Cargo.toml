[package]
name = "supply-drop-ssh-transport-plugin"
version = "0.2.0"
edition = "2024"
description = "SSH process transport plugin for Supply Drop BBS"
license = "Apache-2.0"
repository = "https://github.com/Mesh-America/supply-drop-ssh-transport-plugin"
homepage = "https://mesh-america.github.io/supply-drop-ssh-transport-plugin/"

[[bin]]
name = "supply-drop-ssh"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
rand = "0.10.2"
russh = "0.63.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
